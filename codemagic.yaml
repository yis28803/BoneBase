workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - flutter pub get
      - flutter build ios --debug --no-codesign
      - find build/ios -name "*.app"
      - "APP_PATH=$(find build/ios -name \"*.app\" | head -n 1)"
      - "echo App path: $APP_PATH"
      - "cd $(dirname \"$APP_PATH\")"
      - mkdir -p Payload
      - "cp -r $(basename \"$APP_PATH\") Payload/"
      - zip -r App.ipa Payload/

    artifacts:
      - "build/ios/**/*.ipa"