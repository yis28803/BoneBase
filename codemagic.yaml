workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Build iOS (no codesign)
        script: flutter build ios --profile --no-codesign

      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios -name "*.app" | grep "iphoneos" | head -n 1)
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -r "$(basename "$APP_PATH")" Payload/
          zip -r App.ipa Payload/
          echo "IPA created at: $(pwd)/App.ipa"

    artifacts:
      - build/ios/iphoneos/App.ipa